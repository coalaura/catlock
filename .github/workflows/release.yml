name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

env:
  project_name: catlock

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos:
          - windows
          - linux
        goarch:
          - amd64
          - arm64
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        if: matrix.goos == 'windows'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate resources
        if: matrix.goos == 'windows'
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 make \
            --in winres/winres.json \
            --arch "${{ matrix.goarch }}" \
            --out internal/windows/rsrc \
            --file-version "${{ github.ref_name }}" \
            --product-version "${{ github.ref_name }}"

      - name: Build
        id: build
        uses: coalaura/build@v1
        with:
          os: ${{ matrix.goos }}
          arch: ${{ matrix.goarch }}
          generate: false
          gui: ${{ matrix.goos == 'windows' }}
          output: dist/${{ env.project_name }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
          go-flags: |
            -ldflags=-X main.Version=${{ github.ref_name }}

      - name: Sign
        id: sign
        uses: coalaura/sign@v1
        with:
          path: ${{ steps.build.outputs.path }}
          key: ${{ secrets.COALAURA_PFX }}
          passphrase: ${{ secrets.COALAURA_PFX_PASSWORD }}
          chain: |
            https://wiese2.org/pki/issuing.pem
            https://wiese2.org/pki/root.pem

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: signed-${{ env.project_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.sign.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download signed release
        uses: actions/download-artifact@v8
        with:
          pattern: signed-${{ env.project_name }}-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum -b ${{ env.project_name }}-* > SHA256SUMS

      - name: Attest binaries
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
